<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rulebook Lens</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
  <main>
    <header><p class="eyebrow">University policy, with receipts</p><h1>Rulebook Lens</h1><p class="lead">Ask a question. Read the exact passages that support it. See when the rules disagree.</p></header>
    <section class="ask-card"><label for="question">Ask the rulebook</label><div class="composer"><input id="question" value="Can I sit an exam with 68% attendance?" maxlength="500"><button id="ask">Ask</button></div><div class="examples"><button>What is the deadline for a semester fee refund?</button><button>Can my guest stay overnight in the hostel?</button><button>Can I miss an exam for a family wedding?</button></div></section>
    <section id="result" class="result empty"><p>Your evidence-backed answer will appear here.</p></section>
    <footer>Local corpus • no external AI calls • citations always visible</footer>
  </main><script src="/static/app.js"></script>
</body></html>
